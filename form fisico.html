<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guia de requerimento</title>
</head>
<body>
    <h1>Guia de requerimento</h1>

    <form>
        <label for="protocolo">Protocolo n°</label>
        <input type="number" id="protocolo" name="Protocolo" required>
        <fieldset>
            <label for="requerente">Requerente:</label>
            <input type="text" id="requerente" name="Protocolo" size="50" required><br><br>

            <label for="matricula">N° de matrícula:</label>
            <input type="number" id="matricula" name="Matricula" required>
        </fieldset>

        <fieldset>
        <legend>Preencher</legend>
            
            <label for="data-nascimento">Data de Nascimento:</label>
            <input type="date" id="data-nascimento" name="Data-nascimento" required><br><br>

            <label for="naturalizacao">Naturalidade:</label>
            <select id="naturalizacao" name="Naturalizacao" required>
                <option value="selecione-naturalidade" hidden>Selecione</option>
                <option value="brasileiro">Brasileiro</option>
                <option value="estrangeiro">Estrangeiro</option>
            </select><br><br>

            <label for="filiacao">Filiação:</label>
            <input type="text" id="filiacao" name="Filiacao" size="50" required><br><br>

            <label for="curso">Curso:</label>
            <select id="curso" name="Naturalizacao" required>
                <option value="selecione-curso" hidden>Selecione seu curso</option>
                
                <optgroup label="Graduação">
                <option value="engenharia-eletrica">Engenharia Elétrica</option>
                <option value="engenharia-mecanica">Engenharia Mecânica</option>
                </optgroup>
                <optgroup label="Licenciatura">
                <option value="fisica">Física</option>
                <option value="matematica">Matemática</option>
                </optgroup>
                <optgroup label="Graduação Tecnológica">
                <option value="sistemas">Sistemas de Informação</option>
                <option value="mecatronica">Mecatrônica Industrial</option>
                </optgroup>
            </select>
        </fieldset>

        <fieldset>
        <legend>Assinale</legend>

            <input type="checkbox" id="2-via" name="2-Via" required>
            <label for="2-via">2° via(especificar) - CCA</label><br>
            
            <input type="checkbox" id="aproveitamento-disciplina" name="Aproveitamento-disciplina" required>
            <label for="aproveitamento-disciplina">Aproveitamento de Disciplina(anexar Histórico Escolar e Programa da Disciplina) - Coordenação do Curso</label><br>

            <input type="checkbox" id="matricula-fora-prazo" name="Matricula-fora-prazo" required>
            <label for="matricula-fora-prazo">Matrícula fora do prazo (justificar) - CCA</label><br>

            <input type="checkbox" id="cancelamento-matricula" name="Cancelamento-matricula" required>
            <label for="cancelamento-matricula">Cancelamento da Matrícula - CCA</label><br>

            <input type="checkbox" id="colacao" name="Colacao" required>
            <label for="colacao">Colação de Grau / Colação Especial (justificar) - CCA</label><br>

            <input type="checkbox" id="declaracao" name="Declaracao" required>
            <label for="declaracao">Declaração (especificar) - CCA</label><br>

            <input type="checkbox" id="diploma" name="Diploma" required>
            <label for="diploma">Diploma (especificar) - CCA</label><br>

            <input type="checkbox" id="historico" name="Historico" required>
            <label for="historico">Histórico Escolar - CCA</label><br>

            <input type="checkbox" id="reabertura-matricula" name="Reabertura-matricula" required>
            <label for="reabertura-matricula">Reabertura de Matrícula - CCA</label><br>

            <input type="checkbox" id="segunda-chamada" name="Segunda-chamada" required>
            <label for="segunda-chamada">Segunda Chamada (anexar justificativa e especificar) - Coordenação do Curso</label><br>

            <input type="checkbox" id="reingresso" name="Reingresso" required>
            <label for="reingresso">Reingresso - CCA</label><br>

            <input type="checkbox" id="trancamento-disciplina" name="Trancamento-disciplina" required>
            <label for="trancamento-disciplina">Trancamento de Disciplina (especificar) - Coordenação dos Cursos</label><br>

            <input type="checkbox" id="trancamento-matricula" name="Trancamento-matricula" required>
            <label for="trancamento-matricula">Trancamento de Matrícula (anexar documentação comprobatória) - Coordenação Pedagógica</label><br>

            <input type="checkbox" id="transferencia" name="Transferencia" required>
            <label for="transferencia">Transferência para outra instituição - CCA</label><br>

            <input type="checkbox" id="validacao-conhecimento" name="Validacao-conhecimento" required>
            <label for="validacao-conhecimento">Validação de Conhecimento (especificar) - Coordenação do Cursos</label><br>

            <input type="checkbox" id="reajuste" name="Reajuste" required>
            <label for="reajuste">Reajuste - CCA</label><br>

            <input type="checkbox" id="recorrecao" name="Recorrecao" required>
            <label for="recorrecao">Recorreção de Prova - Coordenação do Curso</label><br>

            <input type="checkbox" id="auxilio-transporte" name="Auxilio-transporte" required>
            <label for="auxilio-transporte">AUXILIO - Transporte - Serviço Social</label><br>

            <input type="checkbox" id="auxilio-moradia" name="Auxilio-moradia" required>
            <label for="auxilio-moradia">AUXILIO - Moradia - Serviço Social</label><br>

            <input type="checkbox" id="auxilio-oculos" name="Auxilio-oculos" required>
            <label for="auxilio-oculos">AUXILIO - Óculos - Serviço Social</label><br>

            <input type="checkbox" id="auxilio-pais" name="Auxilio-pais" required>
            <label for="auxilio-pais">AUXILIO - Pais e Mães - Serviço Social</label><br>

            <input type="checkbox" id="outros" name="Outros" required>
            <label for="outros">Outros (especificar)</label>
        </fieldset><br><br> 
        
            <label for="especificar">Especificar:</label><br>
            <textarea id="especificar" name="Especificar" rows="5" cols="100"></textarea><br><br>

            <label for="justificar">Justificar:</label><br>
            <textarea id="justificar" name="Justificar" rows="5" cols="100"></textarea><br><br>

            <input type="checkbox" id="declarando" name="Declarando" required>
            <label for="declarando">DECLARO CONHECER O REGIMENTO DESTA IFE, BEM COMO O PRAZO NECESSÁRIO À TRAMITAÇÃO DO PROCESSO</label> <br><br>

            <label for="assinatura-requerente">Requerente (Ass. Legível)</label>
            <input type="text" id="assinatura-requerente" name="Assinatura-requerente" size="50" required><br><br>

            <label for="assinatura-funcionario">Funcionário (Ass. Legível)</label>
            <input type="text" id="assinatura-funcionario" name="Assinatura-funcionario" size="50" required><br><br>

            <label for="data">Cedro - CE,</label>
            <input type="date" id="data" name="Data" required><br><br>

        <fieldset>
        
            <strong>Visto (Coordenação de Assuntos Estudantis)</strong><br>
            <input type="radio" id="nao-deve-chave" name="visto-coordenacao" required>
            <label for="nao-deve-chave">O requerente NÃO deve chave de armário</label><br>

            <input type="radio" id="deve-chave" name="visto-coordenacao" required>
            <label for="deve-chave">O requerente deve chave do armário:</label>

            <input type="text" id="deve-chave" name="visto-coordenacao"><br>

            <label for="assinatura-responsavel-chave">Responsável (Ass. Legível)</label>
            <input type="text" id="assinatura-responsavel-chave" name="Assinatura-responsavel-chave" size="50" required><br><br>



            <strong>Visto (Biblioteca)</strong><br>
            <input type="radio" id="nao-deve-livro" name="visto-biblioteca" required>
            <label for="nao-deve-livro">O requerente NÃO deve livros na biblioteca</label><br>

            <input type="radio" id="deve-livro" name="visto-biblioteca" required>
            <label for="deve-livro">O requerente deve livros na biblioteca:</label>

            <input type="text" id="deve-livro" name="visto-biblioteca"><br>

            <label for="assinatura-responsavel-livro">Responsável (Ass. Legível)</label>
            <input type="text" id="assinatura-responsavel-livro" name="Assinatura-responsavel-livro" size="50" required><br>


        </fieldset>
    </form>
</body>
</html>
